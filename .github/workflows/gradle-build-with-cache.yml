name: Gradle Build (with cache)

on:
  # Triggers the workflow on push or pull request events to the main branch
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

  # ❌ Removed 'push' and 'pull_request' triggers
  # ✅ Keep only this trigger for manual execution

  # Allows you to manually run the workflow from the Actions tab on GitHub
  workflow_dispatch:
    inputs:
      runner-label:
        description: 'Select the runner label (e.g., ubuntu-latest, ubuntu-26.04)'
        required: true
        type: choice
        default: 'ubuntu-26.04'
        options:
          - 'ubuntu-26.04'
          - 'ubuntu-latest'
      workflow-run-name:
        description: 'Name of the workflow run (optional)'
        required: false
        default: 'gradle build with cache'

jobs:
  gradle-build:
    # Specifies the runner environment for this job
    runs-on: ubuntu-26.04 #ubuntu-latest

    # Optional: You can specify a matrix of Java versions to test against
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21', '25' ] #Change this to your project's required Java version (e.g., '11', '17', '21', '25')

    steps:
      - name: ⬇️ Checkout Repository
        # Action to check out your repository code
        uses: actions/checkout@v7.0.1

      - name: ☕ Set up JDK ${{ matrix.java }}
        # Action to set up the Java environment
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'


      - name: 📦 Cache Gradle Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Make gradlew Executable
        run: chmod +x gradlew

      - name: ⚙️ Build and Run Tests with Java ${{ matrix.java }}
        run: ./gradlew clean build --refresh-dependencies --info

      # You can add more steps here, such as:
      # - Uploading the build artifact (e.g., a JAR file)
      # - Pushing a Docker image
      # - Deploying to a cloud service


      # --------------------------------------------------------------------
      # ✨ NEW STEP: UPLOAD ARTIFACT
      # --------------------------------------------------------------------
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # This name is what you will see in the GitHub Actions summary page
          name: gradle-artifact-java-${{ matrix.java }}-build-${{ github.run_number }}

          # This is the path to the file you want to upload.
          # It looks like your build created a "jar-with-dependencies" file,
          # so we'll use a wildcard match to capture it.
          # The 'build/libs/' folder is where Gradle places all build output.
          path: build/libs/*.jar

          # Optional: How long to keep the artifact before it's deleted (e.g., 5 days)
          retention-days: 90